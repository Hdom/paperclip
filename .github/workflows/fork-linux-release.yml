name: Fork Linux release
run-name: Fork Linux build ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed commit SHA in Hdom/paperclip
        required: true
        type: string
      draft_release:
        description: Also create a draft GitHub Release (never deploys)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fork-linux-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Hdom/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PAPERCLIP_BUILD_COMMIT: ${{ inputs.source_sha }}
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Validate immutable source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout fork packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: tooling
      - name: Checkout reviewed application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.2'
      - name: Pinned build tools
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          node --version; pnpm --version; rustc --version
          free -h; df -h .
      - name: Discover public dependency cache paths
        id: cache-paths
        working-directory: source
        run: echo "pnpm_store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore locked pnpm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.cache-paths.outputs.pnpm_store }}
          key: fork-pnpm-${{ runner.os }}-${{ runner.arch }}-node24.22.2-pnpm9.15.4-${{ hashFiles('source/pnpm-lock.yaml', 'source/patches/**') }}
      - name: Restore native compiler inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/packages/paperclip-runner/runner/target
          key: fork-cargo-${{ runner.os }}-${{ runner.arch }}-rust1.97.1-${{ hashFiles('source/packages/paperclip-runner/runner/Cargo.lock') }}
      - name: Restore public package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/paperclip-public-npm-cache/_cacache
          key: fork-npm-${{ runner.os }}-${{ runner.arch }}-node24.22.2-${{ hashFiles('source/pnpm-lock.yaml', 'source/patches/**') }}
      - name: Install locked dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Build all workspaces
        working-directory: source
        run: /usr/bin/time -v pnpm build
      - name: Typecheck all workspaces
        working-directory: source
        run: /usr/bin/time -v pnpm typecheck
      - name: Handoff regression tests
        working-directory: source
        run: >-
          pnpm exec vitest run --maxWorkers=1 --testTimeout=60000
          server/src/__tests__/issue-review-checkout.test.ts
          server/src/__tests__/issue-stage-decision-guard.test.ts
          server/src/__tests__/issue-stage-decision-lock.test.ts
          server/src/__tests__/issue-execution-policy.test.ts
          server/src/__tests__/issue-execution-policy-routes.test.ts
          server/src/__tests__/heartbeat-auto-checkout.test.ts
          server/src/__tests__/issues-checkout-wakeup.test.ts
          server/src/__tests__/heartbeat-handoff-crash-child.test.ts
          server/src/__tests__/heartbeat-handoff-execution-wait.test.ts
          server/src/__tests__/issue-wake-diagnostics-routes.test.ts
          server/src/__tests__/server-startup-feedback-export.test.ts
      - name: SSH lifecycle qualification prerequisites
        run: |
          if ! command -v sshd >/dev/null 2>&1; then
            # No ambient SSH listener: only the tests start loopback fixtures.
            sudo systemctl mask --runtime ssh.service ssh.socket
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          command -v sshd
          python3 --version
          git --version
      - name: Scoped GitHub Apps, native secrets and SSH lifecycle qualification
        working-directory: source
        run: node scripts/fork-github-app-regressions.mjs
      - name: Protected SSH assembled handoff and retained-output recovery
        working-directory: source
        run: sudo -n python3 scripts/tests/qualify-isolated-ssh.py --user "$(id -un)" --node-bin "$(dirname "$(command -v node)")"
      - name: Persistent maintenance startup and restart qualification
        working-directory: source
        run: sudo -n python3 scripts/tests/qualify-maintenance-startup.py --user "$(id -un)" --node-bin "$(dirname "$(command -v node)")"
      - name: Qualify single-connection handoff boundaries
        working-directory: source
        run: sudo -n python3 scripts/tests/qualify-isolated-ssh.py --user "$(id -un)" --node-bin "$(dirname "$(command -v node)")" --case chain --handoff-pool-max 1
      - name: Operator utility source and safety regressions
        working-directory: source
        run: |
          node --test scripts/fork-qualification-pool.test.mjs scripts/fork-qualification-inventory.test.mjs scripts/fork-package-cache.test.mjs
          node --test scripts/operations/*.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/operations -p '*_test.py'
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/qualify-maintenance-host.py
          pnpm exec tsc -p scripts/operations/tsconfig.maintenance.json
          python3 scripts/operations/verify-utility-provenance.py --root .
      - name: Guarded approval UI regressions
        working-directory: source
        run: >-
          pnpm exec vitest run --maxWorkers=1
          ui/src/hooks/useUpdateIssueMutation.test.tsx
          ui/src/lib/issue-properties-panel-key.test.ts
          ui/src/components/IssueProperties.test.tsx
          ui/src/components/task-side-panel/TaskSidePanel.test.tsx
          ui/src/pages/IssueDetail.test.tsx
      - name: Install browser acceptance dependency
        working-directory: source
        run: pnpm exec playwright install --with-deps chromium
      - name: Maintenance component desktop and phone acceptance
        working-directory: source
        run: node scripts/tests/qualify-maintenance-ui.mjs tmp/maintenance-ui-evidence
      - name: Desktop and phone guarded approval acceptance
        working-directory: source
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts tests/e2e/human-stage-decision.spec.ts tests/e2e/github-app-identities.spec.ts
      - name: Preserve synthetic browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paperclip-browser-acceptance-${{ inputs.source_sha }}
          path: |
            source/tests/e2e/test-results
            source/tmp/maintenance-ui-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble and relocate native Linux payload
        run: node tooling/scripts/fork-package-linux.mjs "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/fork-release/release" "$PAPERCLIP_BUILD_COMMIT" "$RUNNER_TEMP/paperclip-public-npm-cache"
      - name: Qualify exact protected application and operator archives
        working-directory: source
        run: |
          assets="$RUNNER_TEMP/fork-release/release"
          app="paperclip-${PAPERCLIP_BUILD_COMMIT:0:12}-linux-x64.tar.gz"
          operator="paperclip-${PAPERCLIP_BUILD_COMMIT:0:12}-operator-tools.tar.gz"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          app_digest="$(awk -v name="$app" '$2 == name {print $1}' "$assets/SHA256SUMS")"
          operator_digest="$(awk -v name="$operator" '$2 == name {print $1}' "$assets/SHA256SUMS")"
          [[ "$app_digest" =~ ^[a-f0-9]{64}$ && "$operator_digest" =~ ^[a-f0-9]{64}$ ]]
          sudo -n python3 scripts/tests/qualify-maintenance-cli.py \
            --user "$(id -un)" --node-bin "$(dirname "$(command -v node)")" \
            --archive "$assets/$app" --sha256 "$app_digest" --source "$PAPERCLIP_BUILD_COMMIT" \
            --operator-archive "$assets/$operator" --operator-sha256 "$operator_digest"
      - name: Upload verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paperclip-linux-x64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/fork-release/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  draft-release:
    needs: build
    if: inputs.draft_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: paperclip-linux-x64-${{ inputs.source_sha }}
          path: release
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create "fork-${SOURCE_SHA:0:12}-${GITHUB_RUN_ID}" ./* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft \
            --title "Fork Linux candidate ${SOURCE_SHA:0:12}" \
            --notes "Native Linux x64 candidate from $SOURCE_SHA. Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No deployment performed. See manifest for qualification limits. Node 24 required."



