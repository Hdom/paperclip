name: Fork exact-artifact runtime smoke
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/fork-runtime-smoke.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: fork-runtime-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.repository == 'Hdom/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.2'
      - name: Download and verify exact successful build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Hdom/paperclip/actions/runs/43069710104 > source-run.json
          jq -e '.conclusion == "success" and .head_sha == "c09883e63bf7ff16b8c9ce29518c4474cfa22dfd" and .path == ".github/workflows/fork-linux-release.yml"' source-run.json
          gh api repos/Hdom/paperclip/actions/artifacts/13880170703 > source-artifact.json
          jq -e '.expired == false and .workflow_run.id == 43069710104 and .workflow_run.head_sha == "c09883e63bf7ff16b8c9ce29518c4474cfa22dfd" and .digest == "sha256:fe9fc91ba7259543e0c685b48dff82a66838b556ce14201ca040339ca8fba2b0"' source-artifact.json
          gh api repos/Hdom/paperclip/actions/artifacts/13880170703/zip > candidate.zip
          echo 'fe9fc91ba7259543e0c685b48dff82a66838b556ce14201ca040339ca8fba2b0  candidate.zip' | sha256sum -c -
      - name: Verify inner checksums and extract unchanged payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile, tarfile
          expected = {'SHA256SUMS', 'manifest.json', 'resolved-package-lock.json', 'paperclip-6fa9ab4d8455-linux-x64.tar.gz'}
          with zipfile.ZipFile('candidate.zip') as z:
              assert set(z.namelist()) == expected
              z.extractall('candidate')
          PY
          cd candidate
          sha256sum -c SHA256SUMS
          echo '99a7a3b651d69b264f1ed233a47c93473e44a974496f4adfb652ec236b0fecc6  manifest.json' | sha256sum -c -
          jq -e '.sourceCommit == "6fa9ab4d8455bfd216f9a56d254ff09b6c428f7b" and .workflowCommit == "c09883e63bf7ff16b8c9ce29518c4474cfa22dfd" and .packagingScriptSha256 == "fa1dbed21eccbc407a6d1aca42848a26acf2cbea509d33bec14db0d035806072" and .platform == "linux" and .architecture == "x64"' manifest.json
          python3 - <<'PY'
          import tarfile
          with tarfile.open('paperclip-6fa9ab4d8455-linux-x64.tar.gz') as t:
              assert all(m.name == 'payload' or m.name.startswith('payload/') for m in t.getmembers())
              t.extractall('extracted', filter='data')
          PY
      - name: Fetch reviewed synthetic fixture at fixed public commit
        run: |
          set -euo pipefail
          mkdir -p scripts/fork-runtime-fixture
          cd scripts/fork-runtime-fixture
          for file in codex fake-codex.mjs driver.py verify.py run.py; do
            curl --fail --silent --show-error --location --proto '=https' --max-time 30 "https://raw.githubusercontent.com/Hdom/paperclip/e764b372b6d4f01049677c6db6dc4f24f01a8495/scripts/fork-runtime-fixture/$file" -o "$file"
          done
          sha256sum -c <<'SUMS'
          53067df410ed0ef7243e12c7174be41015a18378cceb49a910b6a2779a6fbec4  codex
          1e902d4f5970b78989040d3c74977ee5de5bd08ad55ad4253a92735a9540529e  fake-codex.mjs
          1c1ff1f0806ab9b76b0c0a461b944efd1c9745be1625c8859ed76af46cc8dc62  driver.py
          0982c4338c767859a0254f6e278ce1ca8c549b3ac6192de40854c331ddb416c3  verify.py
          e07d77eb8c871c386bec50c205208e6f636429305411ff0aec8b93adbcb447f9  run.py
          SUMS
          chmod 0755 codex
      - name: Bounded import, startup, restart, and synthetic handoff
        timeout-minutes: 26
        run: |
          timeout --signal=TERM --kill-after=20s 1500s python3 - <<'PY'
          import ctypes, hashlib, json, os, pathlib, re, shutil, signal, socket, subprocess, time, urllib.request
          root = pathlib.Path.cwd()
          evidence = root / 'evidence'; evidence.mkdir()
          raw = root / 'raw-diagnostics'; raw.mkdir()
          work = root / 'synthetic'; work.mkdir()
          home = work / 'home'; home.mkdir()
          data = work / 'data'
          payload = root / 'candidate/extracted/payload'
          node = shutil.which('node')
          cli = payload / 'node_modules/paperclipai/dist/index.js'
          server = payload / 'node_modules/@paperclipai/server/dist/index.js'
          assert ctypes.CDLL(None).prctl(36, 1, 0, 0, 0) == 0  # adopt orphaned descendants for cleanup
          env = dict(PATH=str(pathlib.Path(node).parent)+':/usr/bin:/bin', HOME=str(home), USER='runner', LANG='C.UTF-8',
              PAPERCLIP_HOME=str(data), PAPERCLIP_INSTANCE_ID='default', PAPERCLIP_DISABLE_CWD_ENV_FILE='true',
              PAPERCLIP_NO_BROWSER='true', PAPERCLIP_OPEN_ON_LISTEN='false', PAPERCLIP_UPDATE_CHECK='0',
              PAPERCLIP_TELEMETRY_DISABLED='1', PAPERCLIP_DEPLOYMENT_MODE='local_trusted',
              PAPERCLIP_DEPLOYMENT_EXPOSURE='private', PAPERCLIP_BIND='loopback', HOST='127.0.0.1', PORT='3107',
              NO_PROXY='127.0.0.1,localhost', NODE_OPTIONS='--max-old-space-size=2048')
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          results = {}; owned = {}
          def interrupted(signum, frame): raise SystemExit(128+signum)
          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          class StageDeadline(Exception): pass
          def stage_timeout(signum, frame): raise StageDeadline()
          signal.signal(signal.SIGALRM, stage_timeout)
          def process_table():
              rows = {}
              for d in pathlib.Path('/proc').iterdir():
                  if not d.name.isdigit(): continue
                  try:
                      fields=(d/'stat').read_text().rsplit(')',1)[1].split()
                      rss=re.search(r'^VmRSS:\s+(\d+)', (d/'status').read_text(), re.M)
                      rows[int(d.name)] = (int(fields[1]), fields[19], int(rss.group(1)) if rss else 0, fields[0])
                  except (FileNotFoundError, ProcessLookupError, PermissionError): pass
              return rows
          def track():
              rows=process_table(); ids={os.getpid()}; changed=True
              while changed:
                  new={pid for pid,row in rows.items() if row[0] in ids}
                  changed=not new.issubset(ids); ids |= new
              ids.discard(os.getpid())
              for pid in ids: owned[pid]=rows[pid][1]
              return sum(rows[pid][2] for pid in ids)
          def cleanup(p):
              track(); rows=process_table(); signaled=[]; forced=False
              ports={3107}
              for marker in data.rglob('postmaster.pid') if data.exists() else []:
                  fields=marker.read_text().splitlines()
                  if len(fields)>3 and fields[3].isdigit() and 0<int(fields[3])<65536: ports.add(int(fields[3]))
              # Signal only the application Node child, never GNU time or its
              # process group: PostgreSQL must be stopped by the app's handler.
              live=lambda table: [pid for pid,start in owned.items()
                  if pid in table and table[pid][1]==start and table[pid][3]!='Z']
              if p.poll() is None:
                  for pid,row in rows.items():
                      if row[0]!=p.pid: continue
                      try:
                          if pathlib.Path('/proc',str(pid),'exe').resolve()!=pathlib.Path(node).resolve(): continue
                          if owned.get(pid)!=row[1]: continue
                          os.kill(pid,signal.SIGTERM); signaled.append(pid)
                      except (FileNotFoundError,ProcessLookupError): pass
              deadline=time.monotonic()+45
              while time.monotonic()<deadline:
                  p.poll(); track(); rows=process_table()
                  if not live(rows): break
                  time.sleep(.2)
              track(); rows=process_table()
              remaining=live(rows)
              if remaining:
                  forced=True
                  for pid in remaining:
                      try: os.kill(pid,signal.SIGKILL)
                      except ProcessLookupError: pass
              p.wait(timeout=5)
              deadline=time.monotonic()+5
              while time.monotonic()<deadline:
                  try:
                      while os.waitpid(-1,os.WNOHANG)[0]: pass
                  except ChildProcessError: pass
                  track(); rows=process_table()
                  remaining=live(rows)
                  if not remaining: break
                  forced=True
                  for pid in remaining:
                      try: os.kill(pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                  time.sleep(.1)
              if remaining: raise RuntimeError('Owned subprocess cleanup incomplete')
              owned.clear()
              pidfiles=[str(file.relative_to(data)) for file in data.rglob('postmaster.pid')] if data.exists() else []
              port_closed=True
              for port in ports:
                  try:
                      with socket.create_connection(('127.0.0.1',port),timeout=1): port_closed=False
                  except OSError: pass
              return {'cleanup_complete':True,'graceful_shutdown':not forced,
                  'forced_kill':forced,'node_pids_signaled':signaled,
                  'postmaster_pid_files':pidfiles,'owned_ports_closed':port_closed,'checked_ports':sorted(ports)}
          def get(url):
              with opener.open('http://127.0.0.1:3107'+url,timeout=3) as response:
                  assert response.status==200
                  return response.read()
          def ready():
              h=json.loads(get('/api/health'))
              assert h['status']=='ok' and h['commit']=='6fa9ab4d8455bfd216f9a56d254ff09b6c428f7b'
          def check_http():
              ready()
              html=get('/').decode()
              assets=set(re.findall(r'/assets/[^\s"<>]+',html))
              assert assets, 'HTML has no bundled assets'
              for asset in assets: get(asset)
              json.loads(get('/api/companies'))
              json.loads(get('/api/instance/task-drain'))
              return {'bundled_assets':len(assets)}
          def exercise(name,args,seconds,readiness,handoff=False):
              begin=time.monotonic(); peak=0; passed=False; details={}
              with open(raw/(name+'.log'),'wb') as log:
                  p=subprocess.Popen(['/usr/bin/time','-v','-o',str(raw/(name+'.time')),node,*args],
                      cwd=work,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
                  signal.alarm(seconds)
                  try:
                      while time.monotonic()-begin<seconds:
                          peak=max(peak,track())
                          if p.poll() is not None:
                              passed=(p.returncode==0 and not readiness); break
                          if readiness:
                              try:
                                  ready(); details=check_http(); passed=True; break
                              except (OSError, ValueError, AssertionError) as error: details['last_readiness_error']=str(error)
                          time.sleep(1)
                      if passed and handoff:
                          passed=False
                          fixture_env={**env,'PAPERCLIP_API_URL':'http://127.0.0.1:3107',
                              'HANDOFF_ROOT':str(work),'HANDOFF_SOURCE_COMMIT':'6fa9ab4d8455bfd216f9a56d254ff09b6c428f7b',
                              'HANDOFF_ARTIFACT_ID':'13880170703'}
                          (work/'handoff-workspace').mkdir()
                          with open(raw/'handoff-fixture.log','wb') as fixture_log:
                              fixture=subprocess.Popen(['/usr/bin/python3',str(root/'scripts/fork-runtime-fixture/run.py')],
                                  cwd=work,env=fixture_env,stdout=fixture_log,stderr=subprocess.STDOUT)
                              fixture_deadline=time.monotonic()+240
                              while fixture.poll() is None and time.monotonic()<fixture_deadline:
                                  peak=max(peak,track())
                                  if p.poll() is not None: raise RuntimeError('Application exited during handoff')
                                  time.sleep(.2)
                              if fixture.poll() is None:
                                  fixture.kill()
                                  fixture.wait(timeout=5)
                                  raise RuntimeError('Handoff fixture exceeded 240 seconds')
                              details['fixture_exit_code']=fixture.returncode
                              passed=fixture.returncode==0
                              fixture_evidence=work/'evidence/handoff'
                              for required in ['verified-http.json','runner-result.json']:
                                  if not (fixture_evidence/required).is_file(): passed=False
                              if passed: details['post_handoff_http']=check_http()
                  except StageDeadline:
                      passed=False
                      details['deadline_exceeded']=True
                  finally:
                      signal.alarm(0)
                      results[name]={'passed':passed,'elapsed_seconds':round(time.monotonic()-begin,2),
                          'peak_sampled_descendant_rss_kib':peak,'exit_before_cleanup':p.poll(),**details}
                      results[name].update(cleanup(p))
                      if readiness and (not results[name]['graceful_shutdown'] or results[name]['postmaster_pid_files'] or not results[name]['owned_ports_closed']):
                          passed=False
                          results[name]['passed']=False
              print(json.dumps({name:results[name]}),flush=True)
              return passed
          try:
              print('BOUNDARY: starting full server index import, not app.js import',flush=True)
              imported=exercise('index-import',['--input-type=module','-e',
                  'console.log("IMPORT_BEGIN"); await import('+json.dumps(server.as_uri())+'); console.log("IMPORT_COMPLETE"); process.exit(0)'],240,False)
              print('BOUNDARY: starting fresh synthetic CLI onboarding',flush=True)
              started=exercise('fresh-start',[str(cli),'onboard','--data-dir',str(data),'--bind','loopback','--yes','--no-install-service','--run'],300,True)
              restarted=False
              if started:
                  print('BOUNDARY: restarting same synthetic instance',flush=True)
                  restarted=exercise('restart',[str(cli),'run','--data-dir',str(data),'--bind','loopback','--no-repair'],180,True)
              handed_off=False
              if imported and started and restarted:
                  print('BOUNDARY: ordinary synthetic handoff on verified runtime',flush=True)
                  handed_off=exercise('handoff',[str(cli),'run','--data-dir',str(data),'--bind','loopback','--no-repair'],300,True,True)
              results['limits']={'node_old_space_mib':2048,'enforced_total_4gib_cap':False,
                  'rss_note':'Sampled sum of descendant RSS; shared pages may be counted more than once',
                  'source_run':43069710104,'artifact_id':13880170703,
                  'source_commit':'6fa9ab4d8455bfd216f9a56d254ff09b6c428f7b',
                  'scope':'Synthetic runtime smoke only; no real models, production or deployment'}
              assert imported and started and restarted and handed_off, 'Runtime smoke did not pass every required stage'
          finally:
              (evidence/'summary.json').write_text(json.dumps(results,indent=2))
              fixture_public=work/'evidence/handoff'
              if fixture_public.exists():
                  public=evidence/'handoff'; public.mkdir()
                  for name in ['fixture.json','driver-events.jsonl','agent-events.jsonl','verified-http.json','runner-result.json','children.jsonl']:
                      source=fixture_public/name
                      if source.is_symlink(): raise RuntimeError('Refusing symlink fixture evidence')
                      if source.is_file():
                          text=source.read_text()
                          if re.search(r'Bearer\s|eyJ[A-Za-z0-9_-]{15,}\.|gh[pousr]_[A-Za-z0-9]{20,}',text):
                              raise RuntimeError('Refusing credential-shaped fixture evidence')
                          (public/name).write_text(text)
              for log in raw.iterdir():
                  if log.name=='handoff-fixture.log': continue
                  lines=log.read_text(errors='replace').splitlines()
                  (evidence/log.name).write_text('\n'.join('[redacted credential-related line]' if re.search(r'token|secret|password|credential|api[_ -]?key|invite|authorization|bearer',line,re.I) else line for line in lines)+'\n')
          PY
      - name: Retain synthetic diagnostics, never instance data or credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paperclip-runtime-smoke-${{ github.run_id }}
          path: evidence/*
          if-no-files-found: warn
          retention-days: 7
